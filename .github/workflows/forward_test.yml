name: Forward test diario

on:
  schedule:
    - cron: '0 23 * * *'   # todos los días a las 23:00 UTC (bien después del cierre de NY)
  workflow_dispatch: {}     # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python forward_test.py
      - run: |
          git config user.name "forward-test-bot"
          git config user.email "actions@github.com"
          git add forward_test_log.csv
          git diff --quiet --cached || git commit -m "Actualiza forward_test_log.csv"
          git push
